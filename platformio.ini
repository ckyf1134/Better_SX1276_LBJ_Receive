; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; 平台版本按本机已缓存的 espressif32 解析（原为不锁定版本的 `espressif32`）。
; 如需固定到某个具体版本，请确认该版本已在本机缓存或可正常下载，否则会触发从
; GitHub 重新下载平台包而失败。
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions/huge_app.csv
monitor_filters =
    esp32_exception_decoder
    time
    ;send_on_enter
    ;colorize
    ;log2file
monitor_speed = 115200
monitor_encoding = UTF-8
upload_speed = 1024000
build_flags =
    -DLILYGO_T3_V1_6
    ; Only SX1276 + POCSAG Pager are used, so disable the rest of RadioLib.
    -DRADIOLIB_EXCLUDE_CC1101
    -DRADIOLIB_EXCLUDE_NRF24
    -DRADIOLIB_EXCLUDE_RF69
    -DRADIOLIB_EXCLUDE_SX1231
    -DRADIOLIB_EXCLUDE_SI443X
    -DRADIOLIB_EXCLUDE_RFM2X
    -DRADIOLIB_EXCLUDE_SX126X
    -DRADIOLIB_EXCLUDE_STM32WLX
    -DRADIOLIB_EXCLUDE_SX128X
    -DRADIOLIB_EXCLUDE_RFM9X
    -DRADIOLIB_EXCLUDE_AFSK
    -DRADIOLIB_EXCLUDE_APRS
    -DRADIOLIB_EXCLUDE_AX25
    -DRADIOLIB_EXCLUDE_BELL
    -DRADIOLIB_EXCLUDE_FSK4
    -DRADIOLIB_EXCLUDE_HELLSCHREIBER
    -DRADIOLIB_EXCLUDE_MORSE
    -DRADIOLIB_EXCLUDE_RTTY
    -DRADIOLIB_EXCLUDE_SSTV
;              -DCORE_DEBUG_LEVEL=6
;              -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG
lib_deps =
    lennarthennigs/ESP Telnet @ ^2.1.2
    olikraus/U8g2@^2.35.4
    madhephaestus/ESP32AnalogRead@^0.2.1
    adafruit/RTClib@^2.1.3
    ;northernwidget/DS3231@^1.1.2
    ;paulstoffregen/Time @ ^1.6.1
